name: terraform-plan

# Runs on every PR that touches terraform/, using the read-only gha-plan
# role so forked/branch PRs can't mutate infra — only main can (see
# terraform-apply.yml).

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write  # to comment the plan on the PR

env:
  # Not secrets — role ARNs and region are safe to keep in-repo. Only
  # HF_TOKEN needs to live in GitHub Secrets (see sync-models.yml).
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "646821141010"
  AWS_PLAN_ROLE_ARN: arn:aws:iam::646821141010:role/gha-huggingface-registry-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color \
            -var="aws_account_id=${{ env.AWS_ACCOUNT_ID }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -out=tfplan | tee plan.txt
        continue-on-error: true

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\n\`\`\`\n${plan}\n\`\`\``,
            });

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
