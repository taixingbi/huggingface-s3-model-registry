name: terraform-apply

# Applies infra changes on push to main, using the write-scoped gha-apply
# role. Requires the "production" environment to be configured with any
# required reviewers if you want a manual approval gate.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  # Not secrets — role ARNs and region are safe to keep in-repo. Only
  # HF_TOKEN needs to live in GitHub Secrets (see sync-models.yml).
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "646821141010"
  AWS_APPLY_ROLE_ARN: arn:aws:iam::646821141010:role/gha-huggingface-registry-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_account_id=${{ env.AWS_ACCOUNT_ID }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_org=${{ github.repository_owner }}"
